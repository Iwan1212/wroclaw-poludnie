<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Wrocław Południe Ultimate Frisbee</title>
    <script>
      // Redirect to the main page for SPA routing on GitHub Pages
      const path = window.location.pathname;
      const repo = '/wroclaw-poludnie';
      if (path.startsWith(repo)) {
        window.location.replace(repo + '/#' + path.slice(repo.length));
      } else {
        window.location.replace(repo + '/');
      }
    </script>
  </head>
  <body>
    <p>Przekierowywanie...</p>
  </body>
</html>
